<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Klippit</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <div id="head">
    <div class="brand"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="4" x2="7" y2="20"/><line x1="7" y1="12" x2="18" y2="4"/><line x1="7" y1="12" x2="18" y2="20"/></svg></div>
    <div class="source-name" id="source-name" title="">no file loaded</div>
    <button id="settings-btn" title="Settings"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>

  <div id="settings-modal" style="display:none">
    <div id="settings-panel">
      <div id="settings-title">Settings</div>

      <div class="field">
        <label for="settings-mpv-keybind">mpv keybind</label>
        <input class="input" type="text" id="settings-mpv-keybind" maxlength="16" placeholder="c" />
      </div>

      <div class="field">
        <label for="settings-mpv-dir">mpv config folder (for portable_config setups)</label>
        <input class="input" type="text" id="settings-mpv-dir" placeholder="Default: %APPDATA%\mpv" />
      </div>

      <div id="settings-status"></div>

      <div id="settings-actions">
        <button id="settings-close-btn" class="mark-btn">Close</button>
        <button id="settings-save-btn" class="mark-btn" style="border-color:var(--red);color:var(--text)">Save &amp; Reinstall</button>
      </div>
    </div>
  </div>

  <div id="setup-warning" style="display:none">
    <span id="setup-warning-text"></span>
    <button id="setup-warning-dismiss" title="Dismiss">&times;</button>
  </div>

  <div id="body-row">
  <div id="main-column">

  <div id="preview-wrap">
    <video id="preview" muted preload="auto"></video>
    <div id="crop-overlay" style="display:none">
      <svg id="crop-mask-svg" width="100%" height="100%">
        <defs>
          <mask id="crop-mask">
            <rect x="0" y="0" width="100%" height="100%" fill="white"/>
            <rect id="crop-mask-hole" x="0" y="0" width="0" height="0" fill="black"/>
          </mask>
        </defs>
        <rect x="0" y="0" width="100%" height="100%" fill="rgba(0,0,0,0.62)" mask="url(#crop-mask)"/>
      </svg>
      <div id="crop-box">
        <div class="crop-grid-line" id="crop-grid-v1"></div>
        <div class="crop-grid-line" id="crop-grid-v2"></div>
        <div class="crop-grid-line crop-grid-h" id="crop-grid-h1"></div>
        <div class="crop-grid-line crop-grid-h" id="crop-grid-h2"></div>
        <div class="crop-handle crop-handle-corner" id="crop-handle-nw" data-handle="nw"></div>
        <div class="crop-handle crop-handle-corner" id="crop-handle-ne" data-handle="ne"></div>
        <div class="crop-handle crop-handle-corner" id="crop-handle-sw" data-handle="sw"></div>
        <div class="crop-handle crop-handle-corner" id="crop-handle-se" data-handle="se"></div>
        <div class="crop-handle crop-handle-edge-h" id="crop-handle-n" data-handle="n"></div>
        <div class="crop-handle crop-handle-edge-h" id="crop-handle-s" data-handle="s"></div>
        <div class="crop-handle crop-handle-edge-v" id="crop-handle-e" data-handle="e"></div>
        <div class="crop-handle crop-handle-edge-v" id="crop-handle-w" data-handle="w"></div>
        <div id="crop-dimensions"></div>
      </div>
    </div>
    <div id="load-prompt" style="display:none">
      <div id="load-prompt-text">Drop a video file here</div>
      <button id="load-browse-btn">Browse for a file&hellip;</button>
    </div>
  </div>

  <div id="seek-row">
    <button class="frame-btn" id="play-pause-btn" title="Play/Pause (Space)">&#9654;</button>
    <button class="frame-btn" id="mute-toggle-btn" title="Unmute preview audio (off by default \u2014 avoids echo if your original player is still open)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><polygon points="4,9 8,9 12,5 12,19 8,15 4,15"/><line id="mute-toggle-x1" x1="17" y1="9" x2="22" y2="14"/><line id="mute-toggle-x2" x1="22" y1="9" x2="17" y2="14"/></svg></button>
    <input type="range" id="volume-slider" min="0" max="100" value="100" title="Volume" style="display:none" aria-label="Preview volume" />
    <button class="frame-btn" id="screenshot-btn" title="Screenshot at current position"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.5"/></svg></button>
    <button class="frame-btn" id="subs-preview-toggle" title="Show/hide subtitle preview (also affects screenshots)" aria-pressed="true">CC</button>
    <input id="seek-bar" type="range" min="0" max="1000" value="0"
           aria-label="Seek position" />
  </div>

  <div class="frame-bar">
    <div class="handle-select" role="group" aria-label="Which point the frame controls adjust">
      <button class="mark-btn" id="sel-in" title="Set In to current position (I)">Mark In</button>
      <button class="mark-btn" id="sel-out" title="Set Out to current position (O)">Mark Out</button>
      <button class="mark-btn" id="add-section-btn" title="Add this range as a section and start marking the next one">+ Add Section</button>
    </div>

    <div id="trim-track">
      <div id="committed-sections"></div>
      <div id="trim-range"></div>
      <div class="trim-handle" id="handle-in" style="left:0%" title="In point"></div>
      <div class="trim-handle" id="handle-out" style="left:20%" title="Out point"></div>
    </div>

    <div class="frame-row">
      <button class="frame-btn" id="fb-bigback" title="back ~1s ( Shift+, )">«</button>
      <button class="frame-btn" id="fb-medback" title="back 5 frames">‹‹</button>
      <button class="frame-btn" id="fb-back" title="previous frame ( , )">‹</button>
      <span class="frame-count" id="frame-count">0 / 0</span>
      <button class="frame-btn" id="fb-fwd" title="next frame ( . )">›</button>
      <button class="frame-btn" id="fb-medfwd" title="forward 5 frames">››</button>
      <button class="frame-btn" id="fb-bigfwd" title="forward ~1s ( Shift+. )">»</button>
    </div>
    <div class="frame-time" id="frame-time">in 0:00.00 &nbsp;&rarr;&nbsp; out 0:00.00 &nbsp;(0:00.00)</div>
    <div id="sections-list"></div>
  </div>

  </div>
  <div id="sidebar">

  <div id="body">

    <div class="section-label">Format</div>
    <div class="seg-group" role="group" aria-label="Output format">
      <button class="seg-btn" id="fmt-mp4" aria-pressed="true">MP4</button>
      <button class="seg-btn" id="fmt-gif" aria-pressed="false">GIF</button>
      <button class="seg-btn" id="fmt-apng" aria-pressed="false">APNG</button>
    </div>

    <div class="section-label">Subtitles</div>
    <div class="seg-group" role="group" aria-label="Burn in current subtitle track" id="subs-group">
      <button class="seg-btn" id="subs-off" aria-pressed="true">Off</button>
      <button class="seg-btn" id="subs-on" aria-pressed="false">Burn in</button>
    </div>
    <div class="frame-time" id="subs-status" style="text-align:left;margin-top:4px"></div>

    <div class="compact-toggles-grid">
      <div id="audio-field">
        <div class="section-label">Audio</div>
        <div class="seg-group" role="group" aria-label="Audio track">
          <button class="seg-btn" id="audio-keep" aria-pressed="true">Keep</button>
          <button class="seg-btn" id="audio-mute" aria-pressed="false">Mute</button>
        </div>
      </div>
      <div>
        <div class="section-label">Crop</div>
        <div class="seg-group" role="group" aria-label="Crop">
          <button class="seg-btn" id="crop-off" aria-pressed="true">Off</button>
          <button class="seg-btn" id="crop-on" aria-pressed="false">On</button>
        </div>
      </div>
    </div>
    <div id="crop-controls" style="display:none">
      <div class="seg-group" role="group" aria-label="Crop aspect ratio" style="margin-top:6px">
        <button class="seg-btn" id="crop-aspect-free" aria-pressed="true" style="flex:1">Free</button>
        <button class="seg-btn" id="crop-aspect-169" style="flex:1">16:9</button>
        <button class="seg-btn" id="crop-aspect-916" style="flex:1">9:16</button>
        <button class="seg-btn" id="crop-aspect-11" style="flex:1">1:1</button>
      </div>
      <div id="crop-reset-row">
        <span id="crop-size-readout"></span>
        <button id="crop-reset-btn">Reset</button>
      </div>
    </div>

    <div class="section-label">Optimization</div>
    <div class="seg-group" role="group" aria-label="Optimization mode">
      <button class="seg-btn" id="mode-quality" aria-pressed="true">Quality</button>
      <button class="seg-btn" id="mode-size" aria-pressed="false">Target size</button>
    </div>

    <!-- Quality mode -->
    <div id="panel-quality">
      <div class="row" style="margin-top:10px" id="crf-field">
        <div class="field">
          <label for="crf">Quality (CRF, lower = better)</label>
          <input class="input" type="range" id="crf" min="15" max="35" value="23" />
        </div>
      </div>
      <div id="gpu-field">
        <div class="section-label">Encoding</div>
        <div class="seg-group" role="group" aria-label="Encoder">
          <button class="seg-btn" id="gpu-off" aria-pressed="true">CPU</button>
          <button class="seg-btn" id="gpu-on" aria-pressed="false" title="Tries GPU hardware encoding, automatically falls back to CPU if unavailable">Try GPU</button>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="res">Resolution</label>
          <select class="input" id="res">
            <option value="0">Source</option>
            <option value="1080">1080p</option>
            <option value="720" selected>720p</option>
            <option value="480">480p</option>
          </select>
        </div>
        <div class="field" id="fps-field" style="display:none">
          <label for="fps">FPS (GIF/APNG)</label>
          <select class="input" id="fps">
            <option value="24" selected>24</option>
            <option value="15">15</option>
            <option value="10">10</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Target-size mode -->
    <div id="panel-size" style="display:none">
      <div class="preset-row" role="group" aria-label="Size presets" style="margin-top:10px">
        <button class="preset-btn" data-mb="10" aria-pressed="false">10MB</button>
        <button class="preset-btn" data-mb="50" aria-pressed="false">50MB</button>
        <button class="preset-btn" data-mb="8" aria-pressed="false">GIF 8MB</button>
      </div>
      <div class="row">
        <div class="field">
          <label for="target-mb">Custom target (MB)</label>
          <input class="input" type="number" id="target-mb" min="0.5" step="0.5" value="10" />
        </div>
      </div>
    </div>

    <div class="section-label">Output</div>
    <div class="row">
      <div class="field">
        <label for="output-filename">Filename</label>
        <div style="display:flex; align-items:center; gap:4px">
          <input class="input" type="text" id="output-filename" />
          <span class="frame-time" id="output-ext" style="margin:0; white-space:nowrap"></span>
        </div>
      </div>
    </div>
    <div id="output-row">
      <div id="output-path" title="">~/Videos/Clips</div>
      <button class="btn secondary" id="browse-btn">Browse…</button>
    </div>

  </div>

  <div id="status-row">
    <div id="status"></div>
    <div id="status-actions" style="display:none">
      <button class="btn secondary" id="reveal-btn">Show in folder</button>
      <button class="btn secondary" id="play-btn">Play</button>
    </div>
  </div>

  <div id="export-row">
    <button class="btn secondary" id="cancel-btn">Escape</button>
    <button class="btn" id="export-btn">
      <span id="export-spinner" class="spinner" style="display:none"></span>
      <span id="export-label">Export (Enter)</span>
    </button>
  </div>

  </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
