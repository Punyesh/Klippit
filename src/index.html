<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Klippit</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <div id="head">
    <div class="brand"><b>K</b>LIPPIT</div>
    <div class="source-name" id="source-name" title="">no file loaded</div>
  </div>

  <div id="preview-wrap">
    <video id="preview" muted></video>
  </div>

  <div id="seek-row">
    <input id="seek-bar" type="range" min="0" max="1000" value="0"
           aria-label="Seek position" />
  </div>

  <div class="frame-bar">
    <div class="handle-select" role="group" aria-label="Which point the frame controls adjust">
      <button class="handle-btn" id="sel-in" aria-pressed="true">In</button>
      <button class="handle-btn" id="sel-out" aria-pressed="false">Out</button>
    </div>

    <div id="trim-track">
      <div id="trim-range"></div>
      <button class="trim-handle" id="handle-in" style="left:0%"
              aria-label="In point" title="drag, or use the frame buttons below"></button>
      <button class="trim-handle" id="handle-out" style="left:20%"
              aria-label="Out point" title="drag, or use the frame buttons below"></button>
    </div>

    <div class="frame-row">
      <button class="frame-btn" id="fb-bigback" title="back ~1s ( Shift+, )">«</button>
      <button class="frame-btn" id="fb-medback" title="back 5 frames">‹‹</button>
      <button class="frame-btn" id="fb-back" title="previous frame ( , )">‹</button>
      <span class="frame-count" id="frame-count">0 / 0</span>
      <button class="frame-btn" id="fb-fwd" title="next frame ( . )">›</button>
      <button class="frame-btn" id="fb-medfwd" title="forward 5 frames">››</button>
      <button class="frame-btn" id="fb-bigfwd" title="forward ~1s ( Shift+. )">»</button>
    </div>
    <div class="frame-time" id="frame-time">in 0:00.00 &nbsp;&rarr;&nbsp; out 0:00.00 &nbsp;(0:00.00)</div>
  </div>

  <div id="body">

    <div class="section-label">Format</div>
    <div class="seg-group" role="group" aria-label="Output format">
      <button class="seg-btn" id="fmt-mp4" aria-pressed="true">MP4</button>
      <button class="seg-btn" id="fmt-gif" aria-pressed="false">GIF</button>
    </div>

    <div class="section-label">Subtitles</div>
    <div class="toggle-row">
      <span class="toggle-label" id="subs-label">Burn in current subtitle track</span>
      <button class="toggle-switch" id="subs-toggle" role="switch" aria-checked="false"
              aria-labelledby="subs-label">
        <span class="toggle-knob"></span>
      </button>
    </div>

    <div class="section-label">Optimization</div>
    <div class="seg-group" role="group" aria-label="Optimization mode">
      <button class="seg-btn" id="mode-quality" aria-pressed="true">Quality</button>
      <button class="seg-btn" id="mode-size" aria-pressed="false">Target size</button>
    </div>

    <!-- Quality mode -->
    <div id="panel-quality">
      <div class="row" style="margin-top:10px">
        <div class="field">
          <label for="crf">Quality (CRF, lower = better)</label>
          <input class="input" type="range" id="crf" min="15" max="35" value="23" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="res">Resolution</label>
          <select class="input" id="res">
            <option value="0">Source</option>
            <option value="1080">1080p</option>
            <option value="720" selected>720p</option>
            <option value="480">480p</option>
          </select>
        </div>
        <div class="field" id="fps-field">
          <label for="fps">FPS (GIF only)</label>
          <select class="input" id="fps">
            <option value="24" selected>24</option>
            <option value="15">15</option>
            <option value="10">10</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Target-size mode -->
    <div id="panel-size" style="display:none">
      <div class="preset-row" role="group" aria-label="Size presets" style="margin-top:10px">
        <button class="preset-btn" data-mb="10" aria-pressed="false">Discord 10MB</button>
        <button class="preset-btn" data-mb="50" aria-pressed="false">Discord 50MB</button>
        <button class="preset-btn" data-mb="8" aria-pressed="false">GIF &lt;8MB</button>
      </div>
      <div class="row">
        <div class="field">
          <label for="target-mb">Custom target (MB)</label>
          <input class="input" type="number" id="target-mb" min="0.5" step="0.5" value="10" />
        </div>
      </div>
    </div>

    <div class="section-label">Output</div>
    <div id="output-row">
      <div id="output-path" title="">~/Videos/Clips</div>
      <button class="btn secondary" id="browse-btn">Browse…</button>
    </div>

  </div>

  <div id="status"></div>

  <div id="export-row">
    <button class="btn secondary" id="cancel-btn">Escape</button>
    <button class="btn" id="export-btn">Export (Enter)</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
