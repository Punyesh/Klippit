<html><head><style>/* Klippit — panel styling
   "Tape deck / broadcast monitor" identity: true video-black, one tally-
   red accent (the record-light color, tying directly to marking in/out
   points), monospace timecodes, system UI font for labels so it reads as
   a native Windows utility rather than a web page in a window frame.
   Sharp rectangular controls throughout — no pill shapes, no iOS-style
   switches — closer to labeled buttons on a hardware panel.

   Density pass: this is a small utility window, not a spacious settings
   page, so paddings/font-sizes below are deliberately tight — every
   control should feel like a compact instrument reading, not a tap
   target sized for a touchscreen. */



* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: #0b0c0e;
  color: #e7e9ec;
  font-family: "Segoe UI", sans-serif;
  font-size: 12px;
  user-select: none;
  overflow-x: hidden;
}

:focus-visible {
  outline: 2px solid #e0342c;
  outline-offset: 1px;
  border-radius: 2px;
}

/* Thin, theme-matched scrollbars instead of the OS default */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2b2e33; border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: #3a3d44; background-clip: padding-box; }

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* Below the header: video + trim controls on the left (grows with the
   window), settings as a fixed-width sidebar on the right — replaces the
   earlier single vertical stack, which capped video height regardless of
   how wide the window got. */
#body-row {
  display: flex;
  flex-direction: row;
  flex: 1;
  min-height: 0;
}
#main-column {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}
#sidebar {
  width: 280px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: #1c1e22;
  border-left: 1px solid #2b2e33;
  min-height: 0;
}

/* ---------- header ---------- */
#head {
  display: flex;
  align-items: center;
  padding: 6px 10px;
  border-bottom: 1px solid #2b2e33;
  background: #1c1e22;
  flex-shrink: 0;
  gap: 8px;
}
#head .brand {
  color: #e0342c;
  display: flex;
  align-items: center;
}
#head .source-name {
  font-family: "Consolas", monospace;
  font-size: 10px;
  color: #7d828a;
  flex: 1 1 auto;
  min-width: 0;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#settings-btn {
  background: none; border: none; color: #7d828a; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 3px; flex-shrink: 0; border-radius: 2px;
}
#settings-btn:hover { color: #e0342c; background: #401512; }

/* Shown only if the background setup check (env var + mpv/VLC script
   install) actually failed at something — invisible otherwise, since a
   working setup shouldn't nag every launch. See window.__klippitSetupWarning
   in app.js and run_setup() in main.rs. */
#setup-warning {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  background: #401512;
  border-bottom: 1px solid #e0342c;
  font-family: "Consolas", monospace;
  font-size: 10px;
  color: #e7e9ec;
  flex-shrink: 0;
  white-space: pre-line;
}
#setup-warning-dismiss {
  background: none; border: none; color: #7d828a; cursor: pointer;
  font-size: 14px; line-height: 1; padding: 0 2px; flex-shrink: 0;
}
#setup-warning-dismiss:hover { color: #e7e9ec; }

/* ---------- settings modal ---------- */
#settings-modal {
  position: fixed;
  top: 0; right: 0; bottom: 0; left: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
#settings-panel {
  background: #1c1e22;
  border: 1px solid #2b2e33;
  border-radius: 4px;
  padding: 16px;
  width: 340px;
  max-width: 90vw;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
#settings-title {
  font-family: "Consolas", monospace;
  font-size: 12px;
  letter-spacing: .08em;
  color: #e7e9ec;
  text-transform: uppercase;
}
#settings-panel .field label {
  font-size: 10px;
  color: #7d828a;
  display: block;
  margin-bottom: 4px;
}
#settings-status {
  font-family: "Consolas", monospace;
  font-size: 10px;
  color: #7d828a;
  white-space: pre-line;
  max-height: 90px;
  overflow-y: auto;
}
#settings-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
#settings-actions .mark-btn { flex: 0 0 auto; padding: 6px 14px; }

/* ---------- video preview ---------- */
#preview-wrap {
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1 1 0;
  min-height: 70px;
  position: relative;
}
/* Active only while crop mode is on. Confirmed real usability issue:
   a full-frame crop box's corner handles sit right at the video's own
   edge, which — with no gap otherwise — can coincide with the actual
   OS window's edge (specifically the left side; top/right/bottom
   already have the header/sidebar/frame-bar for separation), making it
   easy to grab the window's own resize handle by mistake instead of a
   crop handle. getVideoDisplayRect() in app.js accounts for this same
   margin value when computing where the video is actually displayed,
   so the crop overlay still lines up correctly with the (now slightly
   smaller) visible video area. */
#preview-wrap.crop-active {
  padding: 10px;
}
/* Shown only when no file is loaded — see applyInit() toggling this
   based on init.filePath. Sits over the (empty, black) video area
   rather than replacing it, so nothing else in the layout has to shift
   around depending on whether a file happens to be loaded. */
#load-prompt {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border: 1px dashed #2b2e33;
  margin: 12px;
  border-radius: 4px;
  transition: border-color .15s, background .15s;
}
#load-prompt.dragover {
  border-color: #e0342c;
  background: #401512;
}
#load-prompt-text {
  font-family: "Consolas", monospace;
  font-size: 11px;
  color: #7d828a;
  letter-spacing: .04em;
}
#load-browse-btn {
  font-family: "Consolas", monospace;
  font-size: 11px;
  letter-spacing: .04em;
  padding: 6px 14px;
  color: #e7e9ec;
  background: #0b0c0e;
  border: 1px solid #2b2e33;
  border-radius: 2px;
  cursor: pointer;
}
#load-browse-btn:hover { border-color: #e0342c; color: #e0342c; }
#load-browse-btn:active { background: #401512; border-color: #e0342c; }
/* subtitles-octopus.js injects this div as a sibling of <video> to hold
   its subtitle canvas. Left alone, it becomes a second flex item inside
   #preview-wrap (which has no explicit flex-direction, so it's a row by
   default) — competing with the video for layout space and throwing off
   the library's own position math, which assumes a normal block-flow
   parent, not a flex row with two items in it. Taking it out of flex
   flow entirely and stretching it to fill #preview-wrap restores the
   video's original single-item sizing and gives the library's internal
   canvas positioning (computed relative to this div) a stable, correctly
   full-bleed area to work within. */
.libassjs-canvas-parent {
  position: absolute !important;
  inset: 0;
  pointer-events: none;
}
#preview {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
  background: #000;
}

/* ---------- crop overlay ---------- */
/* Positioned in JS relative to the actual displayed video rectangle
   (accounting for object-fit: contain letterboxing/pillarboxing), not
   just #preview-wrap's own box — see getVideoDisplayRect() in app.js.
   Sits above the subtitle overlay's canvas-parent div (z-index) since
   editing a crop while checking subtitle position is a reasonable thing
   to want to see, but the crop box itself should stay on top. */
#crop-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 5;
  pointer-events: none;
}
#crop-mask-svg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
#crop-box {
  position: absolute;
  border: 1px solid #e0342c;
  pointer-events: auto;
  cursor: move;
}
.crop-grid-line {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: rgba(224, 52, 44, 0.35);
  pointer-events: none;
}
.crop-grid-line.crop-grid-h {
  top: auto; bottom: auto; left: 0; right: 0;
  width: auto; height: 1px;
}
#crop-grid-v1 { left: 33.333%; }
#crop-grid-v2 { left: 66.666%; }
#crop-grid-h1 { top: 33.333%; }
#crop-grid-h2 { top: 66.666%; }
.crop-handle {
  position: absolute;
  width: 9px; height: 9px;
  background: #16171a;
  border: 1px solid #e0342c;
  pointer-events: auto;
}
#crop-handle-nw { left: -5px; top: -5px; cursor: nwse-resize; }
#crop-handle-ne { right: -5px; top: -5px; cursor: nesw-resize; }
#crop-handle-sw { left: -5px; bottom: -5px; cursor: nesw-resize; }
#crop-handle-se { right: -5px; bottom: -5px; cursor: nwse-resize; }
/* Edge (width/height-only) handles, midpoint of each side — wider along
   their draggable axis than the corner squares so they're easy to
   distinguish and grab without being visually heavier than the corners. */
.crop-handle-edge-h { left: 50%; margin-left: -9px; width: 18px; height: 7px; cursor: ns-resize; }
.crop-handle-edge-v { top: 50%; margin-top: -9px; width: 7px; height: 18px; cursor: ew-resize; }
#crop-handle-n { top: -4px; }
#crop-handle-s { bottom: -4px; }
#crop-handle-e { right: -4px; }
#crop-handle-w { left: -4px; }
#crop-dimensions {
  position: absolute;
  left: 4px; top: 4px;
  background: rgba(11, 12, 14, 0.85);
  color: #e7e9ec;
  font-family: "Consolas", monospace;
  font-size: 10px;
  padding: 2px 5px;
  border: 1px solid #2b2e33;
  pointer-events: none;
  white-space: nowrap;
}
#crop-controls { margin-top: 6px; }
#crop-reset-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
  font-family: "Consolas", monospace;
  font-size: 10px;
  color: #7d828a;
}
#crop-reset-btn {
  background: none;
  border: 1px solid #2b2e33;
  color: #7d828a;
  font-family: "Consolas", monospace;
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 2px;
  cursor: pointer;
}
#crop-reset-btn:hover { border-color: #e0342c; color: #e0342c; }

/* Seek scrubber */
#seek-row {
  padding: 5px 10px 3px;
  background: #1c1e22;
  border-top: 1px solid #2b2e33;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
#play-pause-btn { flex-shrink: 0; font-size: 9px; padding: 3px 6px; }
/* Compact, appears only while unmuted — see app.js toggling display:
   none/block on mute/unmute rather than always showing it, keeping the
   seek-row uncluttered in the default (muted) state. */
#volume-slider {
  -webkit-appearance: none;
  flex-shrink: 0;
  width: 56px;
  height: 3px;
  border-radius: 0;
  background: #2b2e33;
  cursor: pointer;
  accent-color: #e0342c;
}
#volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 8px; height: 10px;
  border-radius: 1px;
  background: #e7e9ec;
  cursor: pointer;
  margin-top: -3.5px;
}
#volume-slider::-moz-range-thumb {
  width: 8px; height: 10px; border: none; border-radius: 1px;
  background: #e7e9ec; cursor: pointer;
}
#seek-bar {
  -webkit-appearance: none;
  flex: 1;
  height: 3px;
  border-radius: 0;
  background: #2b2e33;
  cursor: pointer;
  display: block;
}
#seek-bar::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 9px; height: 12px;
  border-radius: 1px;
  background: #e7e9ec;
  cursor: pointer;
  margin-top: -4.5px;
}
#seek-bar::-moz-range-thumb {
  width: 9px; height: 12px; border: none; border-radius: 1px;
  background: #e7e9ec; cursor: pointer;
}

/* Trim range track — tape counter/ruler ticks along the bottom edge */
#trim-track {
  position: relative;
  height: 16px;
  margin: 4px 0 1px;
  background: #0b0c0e;
  border: 1px solid #2b2e33;
  background-image: repeating-linear-gradient(
    to right, #2b2e33 0, #2b2e33 1px, transparent 1px, transparent 12.5%
  );
  background-position: 0 bottom;
  background-size: 100% 4px;
  background-repeat: no-repeat repeat;
  flex-shrink: 0;
}
#trim-range {
  position: absolute;
  top: 0; bottom: 0;
  background: #401512;
  border-left: 1px solid #e0342c;
  border-right: 1px solid #e0342c;
}
.trim-handle {
  position: absolute;
  top: -2px;
  width: 7px; height: 20px;
  background: #16171a;
  border: 1px solid #e0342c;
  border-radius: 0;
  cursor: default; /* purely visual now — see app.js, no longer draggable */
  transform: translateX(-50%);
  pointer-events: none; /* was needed for drag hit-testing; now just gets out of the way */
}
/* Subtle shape distinction between In and Out — each handle's rounded
   edge faces into the selected range, its flat edge faces outward, the
   way trim handles are conventionally shaped in real editing software.
   Meant to be noticed on close inspection, not shout for attention. */
#handle-in { border-radius: 0 2px 2px 0; }
#handle-out { border-radius: 2px 0 0 2px; }

/* Committed sections (added via "+ Add Section") render as separate,
   dimmer blocks along the trim track — distinguishable from the
   current in-progress range (#trim-range, brighter/more saturated red)
   without competing with it visually. Positioned via left/width
   percentages set in JS (renderSectionsUI in app.js). */
#committed-sections { position: absolute; top: 0; bottom: 0; left: 0; right: 0; pointer-events: none; }
.committed-section-block {
  position: absolute;
  top: 0; bottom: 0;
  background: rgba(224, 52, 44, 0.18);
  border-left: 1px solid rgba(224, 52, 44, 0.5);
  border-right: 1px solid rgba(224, 52, 44, 0.5);
}

/* List of committed sections — only shown once at least one exists (see
   renderSectionsUI), so this adds no clutter for the common single-clip
   case that never touches "+ Add Section" at all. */
#sections-list { margin-top: 6px; font-family: "Consolas", monospace; font-size: 10px; }
.sections-list-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 3px 6px; background: #0b0c0e; border: 1px solid #2b2e33;
  border-radius: 2px; margin-bottom: 3px; color: #7d828a;
}
.sections-list-row .sect-label { color: #e7e9ec; }
.sections-list-remove {
  background: none; border: none; color: #7d828a; cursor: pointer;
  font-size: 13px; line-height: 1; padding: 0 2px;
}
.sections-list-remove:hover { color: #e0342c; }
#sections-total {
  text-align: center; font-size: 10px; color: #7d828a; margin-top: 4px;
  padding: 4px 6px; line-height: 1.4;
}

/* ---------- frame bar ---------- */
.frame-bar { padding: 5px 10px; background: #1c1e22; border-top: 1px solid #2b2e33; flex-shrink: 0; }
.frame-row { display: flex; align-items: center; gap: 2px; flex-wrap: nowrap; }
.frame-btn {
  background: #0b0c0e; border: 1px solid #2b2e33; color: #e7e9ec;
  border-radius: 2px; padding: 2px 5px; font-size: 11px; cursor: pointer;
  font-family: "Consolas", monospace; line-height: 1.4; flex-shrink: 0; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center;
}
.frame-btn:hover { border-color: #e0342c; color: #e0342c; }
.frame-btn:disabled { opacity: .35; cursor: default; }
.frame-btn[aria-pressed="true"] { color: #e7e9ec; border-color: #e0342c; background: #401512; }
/* Visible while the subtitle overlay is being prepared — see
   setSubtitleLoadingIndicator() in app.js. A subtle pulse rather than
   anything attention-grabbing, since this is an expected wait, not a
   problem. */
.frame-btn.loading { animation: klippit-loading-pulse 1.1s ease-in-out infinite; }
@keyframes klippit-loading-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .45; }
}
.frame-count {
  flex: 1 1 auto; min-width: 0; text-align: center; font-size: 11px; font-weight: 600;
  color: #e7e9ec; font-family: "Consolas", monospace; letter-spacing: .2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.frame-time { text-align: center; font-size: 10px; color: #7d828a; margin-top: 3px; font-family: "Consolas", monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Which handle (In / Out) the frame bar currently arms — a lit dot marks
   the armed one, echoing a tape deck's record-arm indicator. */
.handle-select { display: flex; gap: 4px; margin-bottom: 4px; }
/* Mark In/Mark Out — plain, stateless one-click action buttons. No
   pressed/armed indicator: clicking one does the thing immediately and
   completely, nothing lingers to show afterward (that lingering "which
   one is active" state was the old design, replaced with explicit
   marking — see the redesign notes in app.js). */
.mark-btn {
  flex: 1; padding: 4px 0; text-align: center; font-size: 10px;
  letter-spacing: .06em; cursor: pointer; font-family: "Consolas", monospace;
  color: #e7e9ec; background: #0b0c0e; border: 1px solid #2b2e33; border-radius: 2px;
}
.mark-btn:hover { border-color: #e0342c; color: #e0342c; }
/* Deliberately smaller than Mark In/Mark Out — this is a special-case
   action (most exports are a single range and never touch it), not a
   primary control that should visually compete equally with the two
   buttons everyone uses on every export. */
#add-section-btn { flex: 0.6; color: #7d828a; font-size: 9px; }
#add-section-btn:hover { color: #e0342c; }
.mark-btn:active { background: #401512; border-color: #e0342c; color: #e7e9ec; }

/* ---------- body / options ---------- */
#body { padding: 8px 10px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
.section-label {
  font-size: 9px; letter-spacing: .09em; text-transform: uppercase;
  color: #7d828a; margin: 9px 0 5px; padding-top: 7px; border-top: 1px solid #2b2e33;
  font-family: "Consolas", monospace;
}
.section-label:first-child { margin-top: 0; padding-top: 0; border-top: none; }
/* Audio and Crop are both simple two-button toggles, so they share a
   row instead of each taking a full-width section — reclaims real
   vertical space that used to overflow the default window height (a
   scrollbar showing up on first open was a real, confirmed usability
   problem, made worse as more sections accumulated over time; see the
   window height bump in main.rs, which addresses the same issue from
   the other direction). */
.compact-toggles-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.compact-toggles-grid .seg-group { width: 100%; }
/* Visual divider between the two columns — without it, Audio and Crop
   read ambiguously as one combined section rather than two separate
   ones sharing a row purely for space reasons. */
.compact-toggles-grid > div:nth-child(2) {
  border-left: 1px solid #2b2e33;
  padding-left: 14px;
}

/* Segmented button groups — the one control shape used for every binary
   or multi-way choice (format, subtitles, mode, handle select), rather
   than mixing in a separate switch-shaped widget. Deliberately low and
   plain, not full-height tap targets. */
.seg-group { display: flex; gap: 4px; }
.seg-btn {
  flex: 1; padding: 4px 6px; text-align: center; font-size: 11px;
  color: #7d828a; background: #0b0c0e; border: 1px solid #2b2e33;
  border-radius: 2px; cursor: pointer; font-family: "Segoe UI", sans-serif;
}
.seg-btn[aria-pressed="true"] { color: #e7e9ec; border-color: #e0342c; background: #401512; }
.seg-btn:hover:not([aria-pressed="true"]) { border-color: #7d828a; color: #e7e9ec; }

.row { display: flex; gap: 6px; margin-bottom: 5px; align-items: center; }
.field { flex: 1; }
.field label { display: block; font-size: 10px; color: #7d828a; margin-bottom: 2px; }
.input, select.input {
  width: 100%; background: #0b0c0e; border: 1px solid #2b2e33; color: #e7e9ec;
  padding: 4px 6px; border-radius: 2px; font-size: 11px; outline: none; font-family: "Segoe UI", sans-serif;
}
.input:focus { border-color: #e0342c; }
input[type="range"].input, input[type="range"]#seek-bar { accent-color: #e0342c; }

.preset-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 5px; }
.preset-btn {
  background: #0b0c0e; border: 1px solid #2b2e33; color: #e7e9ec;
  padding: 3px 8px; border-radius: 2px; font-size: 10px; cursor: pointer;
  font-family: "Consolas", monospace;
}
.preset-btn[aria-pressed="true"] { border-color: #e0342c; color: #e7e9ec; background: #401512; }

/* ---------- output + export ---------- */
#output-row { display: flex; gap: 5px; align-items: center; }
#output-path {
  flex: 1; font-size: 10px; color: #7d828a; font-family: "Consolas", monospace;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: #0b0c0e; border: 1px solid #2b2e33; border-radius: 2px; padding: 4px 6px;
}
.btn {
  background: #401512; border: 1px solid #e0342c; color: #e7e9ec;
  padding: 5px 10px; border-radius: 2px; font-size: 11px; cursor: pointer; font-weight: 600;
  font-family: "Segoe UI", sans-serif;
}
.btn:hover { background: #e0342c; color: #0b0c0e; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.secondary { background: transparent; color: #7d828a; border-color: #2b2e33; font-weight: normal; }
.btn.secondary:hover { border-color: #7d828a; color: #e7e9ec; background: transparent; }

#export-row { display: flex; gap: 6px; padding: 7px 10px; border-top: 1px solid #2b2e33; background: #1c1e22; flex-shrink: 0; }
#export-btn { flex: 1; }

#status-row { display: flex; align-items: center; justify-content: space-between; padding: 0 10px 6px; gap: 8px; flex-shrink: 0; }
#status { font-size: 10px; color: #7d828a; min-height: 12px; font-family: "Consolas", monospace; word-break: break-word; flex: 1; user-select: text; cursor: text; }
#status.busy { color: #e0342c; }
#status.error { color: #e0342c; }
#status.done { color: #e7e9ec; }
#status-actions { display: flex; gap: 6px; flex-shrink: 0; }
#status-actions .btn { padding: 3px 8px; font-size: 10px; }

/* Indeterminate spinner shown on the export button while busy — real
   percentage progress would need ffmpeg's own -progress output streamed
   live (see README); this just confirms something is happening. */
.spinner {
  display: inline-block;
  width: 11px; height: 11px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #e7e9ec;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: -2px;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }
